<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flappy Bird</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #70c5ce;
      font-family: sans-serif;
    }

    #game {
      position: relative;
      width: 400px;
      height: 600px;
      margin: auto;
      background: #4ec0ca;
      overflow: hidden;
      border: 3px solid #000;
    }

    #bird {
      position: absolute;
      width: 40px;
      height: 30px;
      background: yellow;
      border-radius: 20px;
      top: 250px;
      left: 50px;
    }

    .pipe {
      position: absolute;
      width: 60px;
      background: green;
      left: 400px;
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: white;
      text-shadow: 2px 2px 2px black;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="bird"></div>
  <div id="score">0</div>
</div>

<script>
  const game = document.getElementById("game");
  const bird = document.getElementById("bird");
  const scoreText = document.getElementById("score");

  let birdY = 250;
  let velocity = 0;
  let gravity = 0.5;
  let jump = -8;
  let pipes = [];
  let score = 0;

  function createPipe() {
    let gap = 150;
    let topHeight = Math.random() * 300 + 50;
    let bottomHeight = 600 - topHeight - gap;

    let topPipe = document.createElement("div");
    topPipe.classList.add("pipe");
    topPipe.style.height = topHeight + "px";
    topPipe.style.top = "0px";

    let bottomPipe = document.createElement("div");
    bottomPipe.classList.add("pipe");
    bottomPipe.style.height = bottomHeight + "px";
    bottomPipe.style.bottom = "0px";

    game.appendChild(topPipe);
    game.appendChild(bottomPipe);

    pipes.push({ top: topPipe, bottom: bottomPipe, x: 400 });
  }

  function update() {
    velocity += gravity;
    birdY += velocity;
    bird.style.top = birdY + "px";

    // Bird hits ground or ceiling
    if (birdY > 570 || birdY < 0) {
      return gameOver();
    }

    // Move pipes
    pipes.forEach(pipe => {
      pipe.x -= 3;
      pipe.top.style.left = pipe.x + "px";
      pipe.bottom.style.left = pipe.x + "px";

      // Collision detection
      if (pipe.x < 90 && pipe.x > 10) {
        let topH = parseInt(pipe.top.style.height);
        let bottomH = parseInt(pipe.bottom.style.height);

        if (birdY < topH || birdY + 30 > 600 - bottomH) {
          return gameOver();
        }
      }

      // Score
      if (pipe.x === 10) {
        score++;
        scoreText.textContent = score;
      }
    });

    // Remove off-screen pipes
    pipes = pipes.filter(pipe => pipe.x > -60);

    requestAnimationFrame(update);
  }

  function gameOver() {
    alert("Game Over! Score: " + score);
    location.reload();
  }

  // Jump on click or space
  document.addEventListener("keydown", () => velocity = jump);
  document.addEventListener("mousedown", () => velocity = jump);

  // Start game
  setInterval(createPipe, 2000);
  update();
</script>

</body>
</html>
